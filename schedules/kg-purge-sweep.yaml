# SIO-1135 / SIO-1358: purges uncurated Incident rows older than
# KG_UNCURATED_RETENTION_DAYS. Cadence and enablement both live ONLY here --
# no env var overrides either (see
# docs/superpowers/specs/2026-08-01-declarative-schedules-design.md).
# Requires KNOWLEDGE_GRAPH_ENABLED at registration time (checked by the
# scheduler as a precondition, not a second on/off switch); with `enabled:
# true` but no KG backend configured, this schedule is skipped with a log,
# never registered.
id: kg-purge-sweep
mode: repeat
cron: "0 3 * * *"
enabled: true
workflow: kg-purge-sweep
