spec_version: "0.1.0"
name: pvh-elastic-iac-agent
version: 0.1.0
description: >
  Natural-language interface for PVH Elastic Cloud IaC changes.
  Translates requests like "downsize eu-b2b warm tier to 8 GB" into
  a validated Terraform change and a GitLab MR.

# SIO-1224: read docs/development/model-upgrade-checklist.md BEFORE changing these.
# The SIO-1213 bump caused six production failures in one day; the checklist's gates exist
# to catch each of them before merge rather than in production.
model:
  # SIO-1213: upgraded from claude-opus-4-6 / claude-sonnet-4-6
  # SIO-1367: downgraded to claude-haiku-4-5 -- probe data (docs/reference/model-probes/
  # claude-haiku-4-5.md) showed no truncation at any elastic-iac role budget, faster latency
  # (p50 1078ms vs opus-4-8's 1882ms), and acceptsTemperature: true so iacDrafter's
  # temperature: 0.1 etc. actually apply (opus-4-8 silently dropped it). Fallback moved to
  # claude-sonnet-4-6 (also acceptsTemperature: true) rather than claude-sonnet-5, so a
  # failover keeps every role's temperature in effect on both legs instead of reintroducing
  # the SIO-1233 silent-drop class only on the fallback path.
  preferred: claude-haiku-4-5
  fallback: claude-sonnet-4-6

# Where the truth lives. The agent reads these on bootstrap.
repository:
  url: https://gitlab.com/pvhcorp/dhco/observability/observability-elastic-iac
  project_id: 82850717
  default_branch: main

skills:
  - id: version-upgrade
  - id: resize-tier
  - id: add-ilm-policy
  - id: pin-fleet-integration
  - id: edit-slo
  - id: edit-alert-rule
  - id: edit-dataview
  - id: edit-cluster-default
  - id: edit-space
  - id: grant-security-role
  - id: edit-deployment-topology
  - id: edit-dashboard
  - id: open-mr
  - id: validate-cluster-state
  - id: query-knowledge-graph
  - id: search-memory

tools:
  # Single facade onto the unified mcp-server-elastic-iac (terraform + git + gitlab + elastic reads).
  - id: elastic-iac

knowledge:
  - knowledge/reference/iac-repo-map.md
  - knowledge/reference/stack-modules.md
  - knowledge/reference/cluster-inventory.md
  - knowledge/reference/conventions.md
  - knowledge/reference/operating-guide.md
  - knowledge/reference/mr-template.md
  - knowledge/issues/
  - knowledge/runbooks/
  - knowledge/specs/
  - knowledge/cost-plans/
  - knowledge/playbook/
# SIO-1285: this list is INERT whenever knowledge/index.yaml exists -- loadKnowledge
# takes the manifest branch only when index.yaml is ABSENT (manifest-loader.ts:166-169).
# index.yaml is the single source of truth for what loads. health-snapshots/ and
# _archive/ were dropped there and are removed here only so the two files agree.

workflows:
  - workflows/tier-resize.yaml
  - workflows/ilm-rollout.yaml

compliance:
  risk_tier: medium
  supervision:
    human_in_the_loop: always            # agent never merges its own MRs
    kill_switch: true
  recordkeeping:
    audit_logging: true
    retention_period: 1y
  segregation_of_duties:
    roles:
      - id: planner
        description: Reads cluster state, drafts the change
        permissions: [read, plan]
      - id: maker
        description: Writes Terraform diff, opens MR
        permissions: [write_branch, open_mr]
      - id: checker
        description: Reviews and approves MR
        permissions: [review, approve, reject]
      - id: executor
        description: Triggers pipeline / apply (human-initiated)
        permissions: [trigger_pipeline]
    conflicts:
      - [maker, checker]
      - [maker, executor]
    assignments:
      pvh-elastic-iac-agent: [planner, maker]
      human-reviewer: [checker, executor]
    enforcement: strict
