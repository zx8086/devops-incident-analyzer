spec_version: "0.1.0"
name: elastic-agent
version: 0.1.0
description: Read-only Elasticsearch log and cluster analysis specialist.

model:
  # SIO-1262: no `fallback:` here on purpose. subAgent is a TOOL_BINDING_ROLE and
  # llm.ts returns the primary unwrapped for those -- RunnableWithFallbacks does not
  # implement bindTools(), which createReactAgent requires. A fallback listed here
  # would be dead config, which is the exact defect SIO-1235 fixed.
  # SIO-1367: downgraded to claude-haiku-4-5 -- probe data showed no truncation at the
  # subAgent role's 8192 budget, faster latency than sonnet-4-6, and acceptsTemperature:
  # true so the temperature: 0.1 constraint below actually applies (sonnet-4-6 already
  # respected it too, so no behavior change on that axis; this is a cost/latency win
  # pending eval:agent confirming tool-calling reliability holds).
  preferred: claude-haiku-4-5
  constraints:
    temperature: 0.1
    max_tokens: 2048

tools:
  - elastic-logs

skills:
  - ml-anomaly-investigation

compliance:
  risk_tier: low
  data_governance:
    pii_handling: redact
