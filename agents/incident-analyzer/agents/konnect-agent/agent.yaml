spec_version: "0.1.0"
name: konnect-agent
version: 0.1.0
description: Read-only Kong Konnect API gateway analysis specialist.

model:
  # SIO-1262: no `fallback:` here on purpose. subAgent is a TOOL_BINDING_ROLE and
  # llm.ts returns the primary unwrapped for those -- RunnableWithFallbacks does not
  # implement bindTools(), which createReactAgent requires. A fallback listed here
  # would be dead config, which is the exact defect SIO-1235 fixed.
  # SIO-1404: restored to claude-sonnet-4-6. The SIO-1367 haiku downgrade was explicitly
  # "pending eval confirming tool-calling reliability holds" -- the SIO-1380 clean baseline
  # (identical-basis judging, AWS connected for the first time) answered it: haiku loses
  # response_quality 0.563 vs 0.767 and root_cause_accuracy 0.531 vs 0.797, and almost never
  # surfaces couchbase evidence (0.029 vs 0.941). Cost ~3.3x accepted per the approved
  # SIO-1380 model-decision gate.
  preferred: claude-sonnet-4-6
  constraints:
    temperature: 0.1
    max_tokens: 2048

tools:
  - konnect-gateway

compliance:
  risk_tier: low
  data_governance:
    pii_handling: redact
