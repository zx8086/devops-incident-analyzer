name: gitlab-api
description: >
  Query GitLab API for CI/CD pipeline status, merge requests, commits,
  code analysis, and repository health for incident investigation.
version: 1.0.0
input_schema:
  type: object
  properties:
    action:
      type: string
      enum: [issues, merge_requests, pipelines, search, code_analysis, graph_analysis]
      description: Type of GitLab operation to perform
    project_id:
      type: string
      description: >
        GitLab project ID or URL-encoded path. Required for project-scoped
        actions (issues/merge_requests/pipelines/code_analysis); NOT required
        for graph_analysis (Orbit tools are group-scoped) or search.
    time_from:
      type: string
      format: date-time
      description: Start of time window (ISO 8601)
    time_to:
      type: string
      format: date-time
      description: End of time window (ISO 8601)
    query:
      type: string
      description: Search query or file path
  # project_id is required only for project-scoped actions; graph_analysis
  # (Orbit, group-scoped) and search do not need it. Advisory guidance to the
  # LLM -- the bridge treats input_schema as opaque, so this documents the
  # contract rather than enforcing it at a validation boundary.
  required: []
  allOf:
    - if:
        properties:
          action:
            enum: [issues, merge_requests, pipelines, code_analysis]
      then:
        required: [project_id]
output_schema:
  type: object
  properties:
    results:
      type: array
      items:
        type: object
    total_count: { type: integer }
annotations:
  requires_confirmation: false
  read_only: true
  cost: low

prompt_template: >
  Query GitLab for CI/CD, merge request, and code analysis data.
  {{#if datasources}}Available data sources: {{datasources}}.{{/if}}
  {{#if compliance_tier}}Compliance tier: {{compliance_tier}} -- all queries are logged.{{/if}}

related_tools:
  - "Use elastic-logs to correlate GitLab deployment timing with log error spikes"
  - "Use kafka-consumer-lag to check if deployment correlates with Kafka backpressure"
  - "Use couchbase-cluster-health to verify database health around deployment time"
  - "Use konnect-api-requests to check if API gateway errors appeared after deployment"

tool_mapping:
  mcp_server: gitlab
  mcp_patterns:
    - "gitlab_*"
  # SIO-1178: read-only map (annotations.read_only: true). The incident analyzer
  # investigates, it does not mutate GitLab; ticket creation runs through the
  # atlassian-backed create-ticket tool. Deliberately unmapped WRITE tools:
  # gitlab_save_work_item, gitlab_save_merge_request, gitlab_save_note,
  # gitlab_save_merge_request_review, gitlab_save_pipeline, gitlab_manage_pipeline
  # (CodeRabbit, PR #441: creates/retries/cancels/deletes despite its list action),
  # gitlab_accept_merge_request, gitlab_add_branch, gitlab_add_commit,
  # gitlab_fork_repository, gitlab_link_work_items.
  #
  # SIO-1918: GitLab 19.4/19.5 consolidated its MCP surface. The per-facet tools
  # (get_issue, get_workitem_notes, get_merge_request_commits/_diffs/_pipelines/
  # _conflicts, get_pipeline_jobs, get_job_log, semantic_code_search) were UNLISTED:
  # still callable upstream "while callers migrate", but no longer in tools/list, so
  # this server does not register them and a name mapped here would resolve to
  # nothing. Their replacements take an `include` facet, ONE per call:
  #   gitlab_get_work_item      include: notes | related_merge_requests
  #   gitlab_get_merge_request  include: diffs | commits | notes | pipelines |
  #                             discussions | approvals | conflicts
  #                             (diffs carries patch text ONLY with detail:
  #                             full_patch; the default returns change counts)
  #   gitlab_get_pipeline       include: jobs | downstream_pipelines | bridge_jobs | artifacts
  #   gitlab_get_job            include: log | artifacts
  #   gitlab_get_commit         include: diff | notes
  # The `jobs` facet carries no failure_reason, duration or timestamps per job;
  # gitlab_get_job (one job) and gitlab_pipeline_failures (ours) do.
  #
  # Also deliberately unmapped, all read-only: gitlab_get_repository_file and
  # gitlab_list_repository_tree (the custom gitlab_get_file_content and
  # gitlab_get_repository_tree cover them), gitlab_list_projects, gitlab_list_groups,
  # gitlab_list_branches, gitlab_get_user, gitlab_list_project_members (org
  # discovery, not incident evidence; gitlab_search resolves projects),
  # gitlab_get_mcp_server_version (diagnostic) and gitlab_get_work_item_types
  # (creation-flow metadata).
  action_tool_map:
    issues:
      - gitlab_get_work_item
      - gitlab_list_work_items
      - gitlab_get_saved_view_work_items
    merge_requests:
      - gitlab_list_merge_requests
      - gitlab_get_merge_request
      - gitlab_get_merge_request_notes
    pipelines:
      - gitlab_list_pipelines
      - gitlab_get_pipeline
      - gitlab_get_job
      - gitlab_get_artifact_file
      - gitlab_pipeline_failures
    search:
      - gitlab_search
      - gitlab_search_labels
      - gitlab_semantic_search
      - gitlab_get_project
      - gitlab_recent_deploys
    code_analysis:
      - gitlab_get_file_content
      - gitlab_get_blame
      - gitlab_get_commit
      - gitlab_get_commit_diff
      - gitlab_list_commits
      - gitlab_get_repository_tree
      - gitlab_list_tags
      - gitlab_list_releases
    graph_analysis:
      - gitlab_graph_schema
      - gitlab_blast_radius
      - gitlab_cross_project_callers
      - gitlab_recent_vulnerabilities
      - gitlab_orbit_query_graph
  action_descriptions:
    issues: when reading or listing GitLab work items (issues, incidents, tasks, epics), their notes, or saved views in a project
    merge_requests: >
      when listing or querying merge requests, their commits/diffs/pipelines/conflicts
      (gitlab_get_merge_request with one include facet per call), or MR notes
      (gitlab_list_merge_requests is the primary code-change correlation path)
    pipelines: when checking CI/CD pipeline status, a pipeline's jobs, a job's log or artifacts, or recent pipeline failures for a project (or ranking pipeline failures group-wide via Orbit)
    search: >
      when running global text or semantic search across GitLab projects (work items,
      MRs, commits, blobs), resolving a project's id and default branch, or listing
      recent deploy MRs group-wide via Orbit
    code_analysis: >
      when reading file content, blame, a commit and its diff, commit listings, the
      repository tree, or which tags and releases shipped (custom REST tools plus
      GitLab's commit, tag and release reads)
    graph_analysis: >
      when tracing cross-project impact -- who calls a changed definition across
      repos, the blast radius of a file/symbol, or group-wide vulnerabilities
      (GitLab Orbit knowledge graph; group-scoped, no per-project resolution
      needed; consumes GitLab Credits)
  action_keywords:
    # SIO-1864: the five actions that had none (only graph_analysis was declared).
    # Phrasing from the eval dataset queries and the MR-correlation sections of the
    # DEVOPS-14xx reports ("MR !852 merged", "which merge requests landed").
    issues:
      - gitlab issue
      - issue number
      - open issues
    merge_requests:
      - merge request
      - merge requests
      - merged mr
      - what changed
      - recent changes
      - code change
    pipelines:
      - pipeline failed
      - ci pipeline
      - pipeline job
      - job log
      - build failure
    search:
      - search the code
      - find in repo
      - code search
    code_analysis:
      - file content
      - git blame
      - commit diff
      - who wrote
    graph_analysis: ["blast radius", "cross-project", "who calls", "callers", "downstream", "dependents", "impact", "knowledge graph", "shared library", "importers"]
