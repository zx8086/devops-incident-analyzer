spec_version: "0.1.0"
name: incident-analyzer
version: 0.1.0
description: >
  DevOps incident analysis orchestrator that correlates logs, events,
  datastore health, and API gateway metrics to help humans triage incidents safely.

# SIO-1224: read docs/development/model-upgrade-checklist.md BEFORE changing these.
# The SIO-1213 bump caused six production failures in one day; the checklist's gates exist
# to catch each of them before merge rather than in production.
model:
  # SIO-1213: upgraded from claude-sonnet-4-6
  preferred: claude-sonnet-5
  fallback:
    - claude-haiku-4-5
  constraints:
    temperature: 0.2
    max_tokens: 4096

# SIO-1372: the light tier (classifier, gapsJudge, absenceJudge -- deliberately cheap,
# high-frequency roles) resolves its model from HERE, not from `model:` above and not from any
# sub-agent manifest. This isolation is what SIO-1262 wanted -- a specialist or root model bump
# can never silently reprice these roles -- now expressed as an independent YAML key instead of a
# hardcoded constant in llm.ts, so it can be changed the same way every other model in this repo
# is changed. No fallback: light-tier roles have never had one (see llm.ts SIO-1225 correction).
lightTierModel:
  preferred: claude-haiku-4-5
  constraints:
    temperature: 0

runtime:
  max_turns: 50
  # SIO-697: graph budget; abort here is the safety net, not the expected end state.
  # SIO-1110: raised to 15 min so pre-fan-out (~30s) + 360s fan-out + 360s alignment
  # retry + the 120s aggregation reserve fit inside the budget.
  timeout: 900

skills:
  - normalize-incident
  - aggregate-findings
  - propose-mitigation
  - incident-postmortem
  - wiki-ingest
  - wiki-query
  - wiki-lint

tools:
  - elastic-logs
  - kafka-introspect
  - couchbase-health
  - konnect-gateway
  - gitlab-api
  - notify-slack
  - create-ticket

agents:
  elastic-agent:
    delegation: auto
  kafka-agent:
    delegation: auto
  capella-agent:
    delegation: auto
  konnect-agent:
    delegation: auto
  gitlab-agent:
    delegation: auto
  # SIO-1229: these two dispatch by name via AGENT_NAMES (sub-agent.ts) but were
  # never declared here, so loadAgent never built them into `subAgents` and
  # buildSubAgentPrompt fell back to the ORCHESTRATOR prompt -- their SOUL.md and
  # RULES.md had never run. Declaring them is what binds those files at runtime.
  atlassian-agent:
    delegation: auto
  aws-agent:
    delegation: auto

delegation:
  mode: router

compliance:
  risk_tier: medium
  supervision:
    human_in_the_loop: conditional
    escalation_triggers:
      - action_type: mutate_production
      - confidence_below: 0.6
      - error_detected: true
    kill_switch: true
  recordkeeping:
    audit_logging: true
    log_format: structured_json
    retention_period: 1y
    log_contents:
      - prompts_and_responses
      - tool_calls
      - decision_pathways
      - model_version
      - timestamps
    immutable: true
  data_governance:
    pii_handling: redact
    data_classification: internal

tags:
  - devops
  - incident-analysis
  - observability
  - multi-datasource
