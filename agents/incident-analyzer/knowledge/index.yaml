name: incident-analyzer-knowledge
description: Domain knowledge for DevOps incident analysis
version: 0.1.0

categories:
  runbooks-general:
    path: general/runbooks/
    description: Cross-datasource and datasource-agnostic runbooks (code-change correlation, MCP tool audit)
  runbooks-aws:
    path: aws/runbooks/
    description: AWS operational runbooks (CloudWatch, ECS, IAM, MSK)
  runbooks-kafka:
    path: kafka/runbooks/
    description: Kafka operational runbooks (consumer lag)
  runbooks-couchbase:
    path: couchbase/runbooks/
    description: Couchbase operational runbooks (slow queries)
  runbooks-elastic:
    path: elastic/runbooks/
    description: Elastic operational runbooks (high error rate)
  systems-map:
    path: general/systems-map/
    description: Service dependency maps and topology
  slo-policies:
    path: general/slo-policies/
    description: SLO/SLA definitions and thresholds

# SIO-640: Phase 2A lazy runbook selection fallback config.
# Consumed by packages/agent/src/runbook-selector.ts when the LLM router
# fails. Filenames are bare basenames (no datasource prefix) and must exist
# under the path of SOME categories.runbooks-* entry (validated at load time
# by packages/gitagent-bridge/src/manifest-loader.ts, which checks the union
# of all runbook-* category directories).
runbook_selection:
  fallback_by_severity:
    critical:
      - kafka-consumer-lag.md
      - high-error-rate.md
      - database-slow-queries.md
      - code-change-correlation.md
    high:
      - kafka-consumer-lag.md
      - high-error-rate.md
      - database-slow-queries.md
      - code-change-correlation.md
    medium:
      - code-change-correlation.md
    low: []
  # SIO-1302: appended to the router's picks (and unioned into the severity
  # fallback above) on every complex turn, unconditionally -- deterministic,
  # never left to LLM-router discretion. Policy: all incidents in this system
  # are software incidents, so code-change investigation is mandatory.
  always_select:
    - code-change-correlation.md
